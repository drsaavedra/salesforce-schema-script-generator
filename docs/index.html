<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salesforce Commerce Schema Script Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Salesforce Commerce SEO</p>
        <h1>Schema Script Generator</h1>
      </div>
      <a class="source-link" href="https://schema.org/Product" target="_blank" rel="noreferrer">schema.org/Product</a>
    </header>

    <main class="workspace">
      <section class="panel schema-panel" aria-labelledby="schema-type-heading">
        <div class="panel-heading">
          <div>
            <p class="step">Step 1</p>
            <h2 id="schema-type-heading">Schema Type</h2>
          </div>
        </div>
        <div class="schema-grid" id="schemaTypeList"></div>
      </section>

      <section class="panel fields-panel" aria-labelledby="fields-heading">
        <div class="panel-heading">
          <div>
            <p class="step">Step 2</p>
            <h2 id="fields-heading">Schema Fields</h2>
          </div>
          <div class="panel-actions">
            <button type="button" id="selectRecommendedButton">Recommended</button>
            <button type="button" id="clearFieldsButton">Clear</button>
          </div>
        </div>
        <div class="field-list" id="fieldList"></div>
        <div class="custom-field-row">
          <input id="customPropertyName" type="text" placeholder="schema.org property" autocomplete="off" />
          <input id="customPropertyField" type="text" placeholder="Product2 field API name" autocomplete="off" />
          <select id="customPropertyType" aria-label="Custom property value type">
            <option value="text">Text</option>
            <option value="number">Number</option>
            <option value="array">Array</option>
            <option value="raw">Raw expression</option>
          </select>
          <button type="button" id="addCustomFieldButton">Add</button>
        </div>
      </section>

      <section class="panel mapping-panel" aria-labelledby="mapping-heading">
        <div class="panel-heading">
          <div>
            <p class="step">Step 3</p>
            <h2 id="mapping-heading">Salesforce Bindings</h2>
          </div>
          <button type="button" id="resetMappingsButton">Reset</button>
        </div>
        <div id="mappingForm" class="mapping-form"></div>
      </section>

      <section class="panel output-panel" aria-labelledby="output-heading">
        <div class="panel-heading">
          <div>
            <p class="step">Output</p>
            <h2 id="output-heading">Head Markup Script</h2>
          </div>
          <div class="panel-actions">
            <button type="button" id="copyButton">Copy</button>
            <button type="button" id="downloadButton">Download</button>
          </div>
        </div>
        <textarea id="scriptOutput" spellcheck="false" aria-label="Generated script"></textarea>
        <p class="status" id="copyStatus" role="status" aria-live="polite"></p>
      </section>
    </main>

    <template id="schemaTypeTemplate">
      <button type="button" class="schema-card">
        <span class="schema-card-title"></span>
        <span class="schema-card-status"></span>
      </button>
    </template>

    <template id="fieldTemplate">
      <label class="field-row">
        <input type="checkbox" />
        <span>
          <strong></strong>
          <small></small>
        </span>
      </label>
    </template>

    <template id="mappingTemplate">
      <div class="mapping-row">
        <label></label>
        <input type="text" autocomplete="off" />
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
