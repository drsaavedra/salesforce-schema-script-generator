<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salesforce Commerce Schema Script Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Salesforce Commerce SEO</p>
        <h1>Schema Script Generator</h1>
      </div>
      <a class="source-link" href="https://schema.org/Product" target="_blank" rel="noreferrer">schema.org/Product</a>
    </header>

    <div class="schema-bar">
      <div class="schema-bar-inner" id="schemaTypeList"></div>
    </div>

    <div class="wizard-container">
      <nav class="steps-nav" aria-label="Steps">
        <button class="step-nav-btn" id="stepNav1" aria-current="step">
          <span class="step-num">1</span>
          <span class="step-label">Select Fields</span>
        </button>
        <span class="step-divider" aria-hidden="true"></span>
        <button class="step-nav-btn" id="stepNav2">
          <span class="step-num">2</span>
          <span class="step-label">Salesforce Bindings</span>
        </button>
        <span class="step-divider" aria-hidden="true"></span>
        <button class="step-nav-btn" id="stepNav3">
          <span class="step-num">3</span>
          <span class="step-label">Output</span>
        </button>
      </nav>

      <section class="wizard-step" id="wizardStep1" aria-labelledby="step1Heading">
        <div class="step-header">
          <h2 id="step1Heading">Select Schema Fields</h2>
          <div class="step-header-actions">
            <button type="button" id="selectRecommendedButton">Recommended</button>
            <button type="button" id="clearFieldsButton">Clear</button>
          </div>
        </div>
        <input id="fieldSearch" class="field-search-input" type="text" placeholder="Search fields..." autocomplete="off" />
        <div class="field-tiles" id="fieldList"></div>
        <div class="field-pagination" id="fieldPagination" hidden>
          <button type="button" id="fieldPrevButton">&larr; Prev</button>
          <span id="fieldPageIndicator">Page 1 of 1</span>
          <button type="button" id="fieldNextButton">Next &rarr;</button>
        </div>
        <div class="step-footer">
          <span></span>
          <button type="button" class="btn-primary" id="nextButton">Next &rarr;</button>
        </div>
      </section>

      <section class="wizard-step" id="wizardStep2" aria-labelledby="step2Heading" hidden>
        <div class="step-header">
          <h2 id="step2Heading">Salesforce Bindings</h2>
          <button type="button" id="resetMappingsButton">Reset</button>
        </div>
        <div id="mappingForm" class="mapping-form"></div>
        <div class="step-footer">
          <button type="button" id="backButton1">&larr; Back</button>
          <button type="button" class="btn-primary" id="finishButton">Finish &rarr;</button>
        </div>
      </section>

      <section class="wizard-step" id="wizardStep3" aria-labelledby="step3Heading" hidden>
        <div class="step-header">
          <h2 id="step3Heading">Head Markup Script</h2>
          <div class="step-header-actions">
            <button type="button" id="copyButton">Copy</button>
            <button type="button" id="downloadButton">Download</button>
          </div>
        </div>
        <div id="outputWarnings" class="output-warnings" aria-live="polite"></div>
        <textarea id="scriptOutput" spellcheck="false" aria-label="Generated script"></textarea>
        <div class="step-footer">
          <button type="button" id="backButton2">&larr; Edit</button>
          <a class="validator-link" href="https://validator.schema.org/" target="_blank" rel="noreferrer">Validate on schema.org &rarr;</a>
        </div>
        <p class="status" id="copyStatus" role="status" aria-live="polite"></p>
      </section>
    </div>

    <template id="schemaTypeTemplate">
      <button type="button" class="schema-card">
        <span class="schema-card-title"></span>
        <span class="schema-card-status"></span>
      </button>
    </template>

    <template id="fieldTemplate">
      <label class="field-row">
        <input type="checkbox" />
        <span>
          <strong></strong>
          <small></small>
        </span>
      </label>
    </template>

    <template id="mappingTemplate">
      <div class="mapping-row">
        <label></label>
        <input type="text" autocomplete="off" />
      </div>
    </template>

    <script src="schema-parser.js"></script>
    <script src="app.js"></script>
  </body>
</html>
