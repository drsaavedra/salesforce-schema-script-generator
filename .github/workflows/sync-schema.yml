name: Sync schema.org TTL

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest schemaorg release version
        id: latest
        run: |
          VERSION=$(curl -s https://api.github.com/repos/schemaorg/schemaorg/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest schemaorg release: $VERSION"

      - name: Check current stored version
        id: stored
        run: |
          STORED=$(cat .schema-version 2>/dev/null || echo "none")
          echo "stored=$STORED" >> "$GITHUB_OUTPUT"
          echo "Stored version: $STORED"

      - name: Download and update TTL if version changed
        if: steps.latest.outputs.version != steps.stored.outputs.stored
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          curl -L -f -o docs/data/schema.ttl \
            "https://schema.org/version/${VERSION_NUM}/schemaorg-current-https.ttl"
          echo "$VERSION" > .schema-version
          echo "Downloaded schema.ttl at version $VERSION"

      - name: Commit and push if changed
        if: steps.latest.outputs.version != steps.stored.outputs.stored
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/schema.ttl .schema-version
          git commit -m "chore: sync schema.org to ${{ steps.latest.outputs.version }}"
          git push
